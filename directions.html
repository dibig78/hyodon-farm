<!-- 정적 런치 스플래시: JS가 뜨기 전 첫 페인트부터 오렌지 + 아이콘을 보여줘서
     네이티브 시작 이미지와 React 스플래시 사이의 흰 깜빡임을 없앤다.
     standalone(홈 화면 앱)일 때 한 세션에 한 번만 표시된다
     (이미 봤으면 sessionStorage 표시로 건너뜀). (인라인이라 테마 토큰 대신 직접 값을 쓴다.) -->
<style>#hyodon-launch-splash-static{display:none}html.is-standalone #hyodon-launch-splash-static{z-index:9999;background:#d9551f;justify-content:center;align-items:center;display:flex;position:fixed;inset:0}html.is-standalone #hyodon-launch-splash-static img{object-fit:cover;border-radius:10px;width:144px;height:144px}</style>
<script>(function(){try{var sa=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;if(sa&&!sessionStorage.getItem('hyodon-splash-shown')){document.documentElement.classList.add('is-standalone')}}catch(e){}})();</script>
